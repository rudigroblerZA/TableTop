name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  security-events: write
  
jobs:
  # ── XAML gates ────────────────────────────────────────────────────────────
  # Deliberately first, and deliberately independent of every other job: these
  # are pure-Python static checks that need no SDK, no workload and no restore,
  # so they still report when the build is broken. They catch two classes of
  # bug that a XAML *compile* does not:
  #
  #   check-maui-xaml.py      MAUI properties that don't exist on the control
  #   check-winui-xaml.py     WinUI properties that don't exist at all
  #   check-xaml-bindings.py  bindings that resolve to nothing and render EMPTY
  #
  # Both existed as scripts before this job did, and neither had ever been run
  # by CI — which is how the failures they describe reached shipped builds.
  xaml:
    name: XAML Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MAUI control properties
        run: python3 scripts/check-maui-xaml.py

      # WinUI had no property check at all until a pip strip shipped with
      # LetterSpacing — a CSS name; WinUI calls it CharacterSpacing. The file
      # was well-formed, every binding resolved, every StaticResource resolved,
      # and none of those can tell you a property does not exist.
      - name: Check WinUI control properties
        run: python3 scripts/check-winui-xaml.py

      # Catches a missing using for a shared type. check-ui-compiles.py was
      # written for this and structurally cannot do it: the compiler stops at
      # 100 errors, and an unresolvable framework type masks a first-party one
      # in the same expression. This checks the fact directly instead.
      - name: Check shared-type usings
        run: python3 scripts/check-shared-usings.py

      # Catches a MAUI page calling a plain method a shared ViewModel doesn't
      # expose — the ICommand-vs-plain-method duality (WinUI binds commands,
      # MAUI's code-behind calls methods directly) went unchecked once and
      # four call sites broke in one build.
      - name: Check MVVM method parity
        run: python3 scripts/check-mvvm-method-parity.py

      - name: Check XAML bindings resolve (all heads)
        run: python3 scripts/check-xaml-bindings.py

      # Backlog item 12. HeadFamilyCoverageTests cannot reference the MAUI or
      # WinUI projects (both need SDKs this job doesn't have), so it keeps a
      # hand-typed copy of each head's declared ControllerFamily support. This
      # is what stops that copy going stale: "updating the head alone changes
      # nothing" was the exact gap item 12 found, since the test read only its
      # own copy.
      - name: Check head family-coverage declarations match their test copy
        run: python3 scripts/check-head-family-coverage.py

      # Backlog item 27. An exception escaping an `async void` handler
      # terminates the process on Android. The codebase documented that above
      # four handlers and applied it by hand, so eight others never got it —
      # and two of the eight were missed even by a careful manual count, which
      # is why this is a script and not a review habit.
      #
      # Covers BOTH Android-producing heads as of backlog N.4. It was
      # check-maui-async-void.py and scanned MAUI alone, so the native head —
      # the one where this crash actually happens — shipped in 1.32.0 with a
      # handler no gate looked at. Hand-guarded, which is precisely the state
      # MAUI was in when item 27 found eight misses.
      - name: Check async void handlers are guarded (MAUI + native Android)
        run: python3 scripts/check-async-void.py

      # Backlog K.4. Five directories literally named "{Base,Modes,Data}" and
      # similar were committed — brace expansion run under sh, which doesn't
      # expand braces. All empty, and one had an unbalanced brace, meaning that
      # setup command was truncated.
      - name: Reject brace-expansion artefact paths
        run: |
          found=$(find . -path ./.git -prune -o -name '*{*' -print)
          if [ -n "$found" ]; then
            echo "Paths containing '{' — almost certainly unexpanded brace expansion:"
            echo "$found"
            exit 1
          fi
          echo "no brace-expansion artefacts"

  # ── Security scanning ────────────────────────────────────────────────────
  # Filesystem scan for known-vulnerable NuGet packages and committed secrets.
  # Independent of the build and the SDK, same reasoning as the xaml job
  # above: it should still report even when the build itself is red.
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aqua Security Trivy installer
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Report-only for now — this job has no baseline yet. Same staged
          # rollout as TreatWarningsAsErrors on the UI heads below: turn this
          # into a real gate (exit-code: 1) once the current findings are
          # triaged, not on day one against an unknown starting point.
          exit-code: "0"

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud wants full history for blame data and PR decoration

      - name: Set up JDK 17
        uses: actions/setup-java@v4.8.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── SonarCloud ───────────────────────────────────────────────────────────
      # Skipped on PRs from forks: GitHub withholds repository secrets from
      # fork-originated pull_request runs, so SONAR_TOKEN would be empty there
      # and analysis would fail outright rather than degrade gracefully. Wrapped
      # in continue-on-error so a SonarCloud-side hiccup can't fail the build or
      # block the `lint` job, which depends on this one.

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Restore local tools
        run: dotnet tool restore

      - name: Scanner Begin
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"rudigroblerZA_TableTop"
          /o:"rudigroblerza"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="tests/TableTop.Tests/TestResults/**/coverage.opencover.xml"
          /d:sonar.coverage.exclusions="**/*.py"

      # ── Restore ──────────────────────────────────────────────────────────────

      - name: Restore packages
        run: dotnet restore TableTop.Engine.slnx

      - name: Build Core
        run: dotnet build src/TableTop.Core/TableTop.Core.csproj
             --no-restore -c Release
             
      - name: Build Games
        run: dotnet build src/TableTop.Games/TableTop.Games.csproj
             --no-restore -c Release

      - name: Build Hosting
        run: dotnet build src/TableTop.Hosting/TableTop.Hosting.csproj
             --no-restore -c Release

      # Backlog X.4. Console is a shipping head and nothing in CI compiled it.
      # The comment on the UI-heads job below said "CI compiled the engine and
      # Console only", which was false in both directions: these steps name
      # individual projects rather than building the solution, and Console was
      # not in TableTop.Engine.slnx at all (it is now — README and CLAUDE.md
      # already claimed it was). A restore of the solution does not compile it.
      #
      # Warnings-as-errors from the start: Console builds clean today, so this
      # never has the "fails for reasons unrelated to your change" problem the
      # graphical heads had.
      - name: Build Console
        run: dotnet build ui/TableTop.Console/TableTop.Console.csproj
             --no-restore -c Release
             -p:TreatWarningsAsErrors=true

      # ── Tests ─────────────────────────────────────────────────────────────────

      - name: Run tests
        run: dotnet test tests/TableTop.Tests/TableTop.Tests.csproj
             -c Release
             --logger "trx;LogFileName=test-results.trx"
             --logger "console;verbosity=normal"
             --collect:"XPlat Code Coverage"
             --settings coverage.runsettings
             --results-directory tests/TableTop.Tests/TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/TableTop.Tests/TestResults/*.trx

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: tests/TableTop.Tests/TestResults/**/coverage.cobertura.xml

      # Human-readable coverage summary, from the same run above — not a
      # second test pass. reportgenerator turns the raw Cobertura XML into a
      # number worth reading rather than an artifact worth downloading.
      - name: Generate coverage summary
        if: always()
        run: |
          dotnet reportgenerator \
            -reports:tests/TableTop.Tests/TestResults/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;Html"
          cat coverage-report/Summary.txt

      # Backlog L.1. CI has collected Cobertura and printed this summary all
      # along — but printing is not enforcing. Nothing failed when a number went
      # down, so it was an artifact to download rather than a gate.
      #
      # Floors sit ~1 point under the measured values, on purpose: this should
      # catch a real regression, not fail because a refactor moved twenty lines
      # between files. Per-assembly floors matter more than the total, because
      # Games is ~60% of the tree at 93% and can mask a sharp fall in Hosting or
      # Presentation while the total barely moves.
      #
      # NOT `if: always()` — unlike the reporting steps above. A failed test run
      # produces partial coverage, and failing this too would bury the real
      # cause under a second, misleading error.
      - name: Enforce coverage floors
        run: python3 scripts/check-coverage.py tests/TableTop.Tests/TestResults

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/

      - name: Scanner End
        # always(): a build or test failure earlier in the job must not leave
        # this Sonar analysis session dangling without a matching end — run
        # whenever Begin would have (same fork check), pass or fail.
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # ── UI heads ──────────────────────────────────────────────────────────────
  # Until this existed, CI compiled the engine and Console only. The graphical
  # heads reached the release zip without anything ever compiling them, so a
  # renamed ViewModel property or a bad XAML attribute was found by a user, not
  # by a build. (WPF was one of these heads; it has since been removed.)
  #
  # These jobs are slower and need a Windows runner and the MAUI workload. That
  # cost is the point: these heads are the product.
  #
  # TreatWarningsAsErrors: the staged rollout this note used to promise
  # ("turn it on per-head once each is green") is now done, per head, under
  # backlog X.4. Each was measured with --no-incremental before being switched
  # on, so none of these turned on against an unknown starting point:
  #
  #   WinUI            0 warnings  → on
  #   Android (native) 0 warnings  → on
  #   Console          0 warnings  → on (in build-and-test, above)
  #   MAUI            96 warnings  → OFF, see below
  #
  # MAUI is the one exception and stays off deliberately. All 96 are CS0618
  # against .NET 10 MAUI deprecations — DisplayAlert→DisplayAlertAsync,
  # Frame→Border, ScaleXTo/FadeTo/TranslateTo→*Async. Clearing them means
  # migrating to async variants across the head, which changes behaviour at
  # every call site and is its own change with its own review; bundling it into
  # a CI-configuration commit would be the wrong trade. Tracked as backlog X.6.

  build-windows-heads:
    name: Build WinUI
    runs-on: windows-latest
    needs: xaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # WinUI declares <Platforms>x86;x64;ARM64</Platforms> with no AnyCPU, so
      # an explicit platform is required or the build cannot pick one.
      - name: Build WinUI
        run: dotnet build ui/TableTop.WinUI/TableTop.WinUI.csproj -c Release -p:Platform=x64
             -p:TreatWarningsAsErrors=true

      # Backlog G.4. The only tests that touch a ViewModel. They reference
      # TableTop.WinUI, so they run here rather than in the cross-platform job.
      #
      # These were commented out because the test host could not start at all —
      # a FileNotFoundException on Microsoft.TestPlatform.CoreUtilities before a
      # single test ran. That was fixed by CopyLocalLockFileAssemblies on the
      # UiTests project, and item 23 declared them "re-enabled" — but only the
      # comment changed; the steps stayed commented for four more releases.
      # Actually enabled under backlog X.3, after running them green twice
      # locally on this job's exact configuration (Release, x64): 2/2 in 361ms.
      #
      # Worth knowing before reading a failure: those two [Fact]s are
      # assembly-wide reflection sweeps over every ViewModel, so one red test
      # can mean any of dozens of members. The assertion messages carry the
      # detail, not the test name.
      - name: Run UI tests
        run: dotnet test tests/TableTop.UiTests/TableTop.UiTests.csproj -c Release -p:Platform=x64
             --logger "trx;LogFileName=ui-test-results.trx"
             --results-directory tests/TableTop.UiTests/TestResults

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: tests/TableTop.UiTests/TestResults/*.trx

      # Packaging, still being worked out — left commented deliberately rather
      # than enabled, unlike the steps above. Kept through the item 23 merge
      # because it is work in progress, not a step that was switched off.
      # - name: Publish WinUI
      #   run: dotnet publish ui/TableTop.WinUI/TableTop.WinUI.csproj -f net10.0-windows10.0.19041.0 -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false

  build-maui:
    name: Build MAUI
    runs-on: windows-latest
    needs: xaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Build MAUI Windows
        run: dotnet build ui/TableTop.Maui/TableTop.Maui.csproj -c Release -f net10.0-windows10.0.19041.0

      - name: Build MAUI Android
        run: dotnet build ui/TableTop.Maui/TableTop.Maui.csproj -c Release -f net10.0-android

  # ── Native Android head ──────────────────────────────────────────────────
  # TableTop.Android is a native .NET for Android head (Mono.Android, not MAUI).
  # It needs only the `android` workload and a JDK — no MAUI workload, no
  # Windows — so it builds on the cheap Linux runner.
  build-android:
    name: Build Android (native)
    runs-on: ubuntu-latest
    needs: xaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install workload
        run: dotnet workload install android --ignore-failed-sources

      - name: Build Android (Release)
        run: dotnet build ui/TableTop.Android/TableTop.Android.csproj -c Release -f net10.0-android
             -p:TreatWarningsAsErrors=true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TableTop.Engine.slnx

      # Check that the engine assemblies produce zero XML doc warnings.
      # Missing <summary> tags surface as CS1591 — caught here, not locally.
      #
      # All FOUR assemblies as of backlog X.4. This covered Core and Hosting
      # only, so an undocumented public member could land in Games or
      # Presentation unchecked — Presentation being the shared ViewModel layer
      # three heads consume, where it costs the most. Both were measured clean
      # before being added here, so this turns on with no fixes attached.
      - name: Check XML documentation completeness (Core)
        run: dotnet build src/TableTop.Core/TableTop.Core.csproj
             --no-restore -c Release
             /p:TreatWarningsAsErrors=true
             /p:GenerateDocumentationFile=true

      - name: Check XML documentation completeness (Games)
        run: dotnet build src/TableTop.Games/TableTop.Games.csproj
             --no-restore -c Release
             /p:TreatWarningsAsErrors=true
             /p:GenerateDocumentationFile=true

      - name: Check XML documentation completeness (Hosting)
        run: dotnet build src/TableTop.Hosting/TableTop.Hosting.csproj
             --no-restore -c Release
             /p:TreatWarningsAsErrors=true
             /p:GenerateDocumentationFile=true

      - name: Check XML documentation completeness (Presentation)
        run: dotnet build src/TableTop.Presentation/TableTop.Presentation.csproj
             --no-restore -c Release
             /p:TreatWarningsAsErrors=true
             /p:GenerateDocumentationFile=true
